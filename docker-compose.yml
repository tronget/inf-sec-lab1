# Local container run. Provide JWT_SECRET_KEY from your shell, e.g.
#   JWT_SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')" docker compose up
services:
  api:
    build: .
    image: lab1-secure-rest-api:latest
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: production
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      DATABASE_URL: sqlite:////data/app.db
      BCRYPT_ROUNDS: "12"
      RATELIMIT_ENABLED: "true"
      ENABLE_HSTS: "false"
      LOG_LEVEL: INFO
    volumes:
      - api-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  api-data:
