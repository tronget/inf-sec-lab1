# ---------------------------------------------------------------------------
# Tooling configuration only. Dependencies live in requirements*.txt so that
# pip-audit (SCA) and Dependabot can read an explicit, fully pinned manifest.
# ---------------------------------------------------------------------------

[project]
name = "lab1-secure-rest-api"
version = "1.0.0"
description = "Hardened REST API (Flask + JWT + bcrypt + SQLAlchemy) with a security CI/CD pipeline"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py39"
# Markdown is documentation, not source: ruff must not rewrite the code
# snippets quoted in README.md / docs/*.md.
extend-exclude = [".venv", "build", "dist", "*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (mirrors the SAST rules in the editor)
    "T20", # flake8-print
    "RUF", # ruff-specific
]
ignore = [
    "UP006", # keep typing.Dict/List - the code must import cleanly on Python 3.9
    "UP007", # keep typing.Optional instead of X | Y for the same reason
    "UP035",
    "UP045",
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use `assert`, hardcoded sample credentials and long payloads.
"tests/*" = ["S101", "S105", "S106", "E501"]
"app/cli.py" = ["S105"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Make the project root importable for both `pytest` and `python -m pytest`.
pythonpath = ["."]
# `-q` is passed on the command line (see the Makefile) so that
# `pytest -q` does not become `-qq` and hide the summary line.
addopts = "--strict-markers --strict-config"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
