# ---------------------------------------------------------------------------
# CI/CD pipeline with security scanners.
#
#   lint      - ruff (style + a mirror of the bandit rules)
#   test      - pytest on Python 3.11 and 3.12, coverage gate at 85%
#   sast      - bandit          (Static Application Security Testing)
#   sca       - pip-audit       (Software Composition Analysis)
#   sca-owasp - OWASP Dependency-Check (best effort, needs an NVD API key)
#   secrets   - gitleaks        (best effort)
#   security-gate - the single required check for branch protection
#
# Every job writes a human-readable summary to the GitHub job summary page,
# which is what the report screenshots are taken from.
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [main, master, develop, "feature/**"]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
  schedule:
    # Weekly re-scan so newly published CVEs are caught even without a commit.
    - cron: "17 6 * * 1"

# Least privilege by default; individual jobs widen it only where required.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_DEFAULT: "3.12"

jobs:
  # -------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: ruff check
        run: ruff check . --output-format=github

      - name: ruff format --check
        run: ruff format --check .

      - name: Summary
        if: always()
        run: echo "### Lint completed" >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------------
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest with coverage gate
        env:
          APP_ENV: testing
        run: |
          pytest -q \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=85 \
            --junitxml=junit.xml

      - name: Coverage summary
        # Cosmetic only: a problem rendering the summary must never fail the job.
        if: always()
        continue-on-error: true
        run: |
          {
            echo "### Tests - Python ${{ matrix.python-version }}"
            echo ""
            python - <<'PY'
          import xml.etree.ElementTree as ET

          try:
              root = ET.parse("coverage.xml").getroot()
              rate = float(root.get("line-rate", 0)) * 100
              print(f"Line coverage: **{rate:.2f}%** (gate: 85%)")
          except Exception as exc:  # noqa: BLE001
              print(f"Coverage report unavailable: {exc}")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: |
            coverage.xml
            junit.xml
          retention-days: 14

  # -------------------------------------------------------------------------
  sast:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install bandit
        run: |
          python -m pip install --upgrade pip
          pip install "bandit[toml,sarif]==1.8.6"

      - name: Run bandit (human readable report)
        id: bandit_txt
        continue-on-error: true
        run: |
          bandit -c bandit.yaml -r app -f txt -o bandit-report.txt || true
          {
            echo "### SAST - bandit"
            echo ""
            echo '```text'
            cat bandit-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run bandit (JSON report)
        continue-on-error: true
        run: bandit -c bandit.yaml -r app -f json -o bandit-report.json || true

      - name: Run bandit (SARIF report)
        continue-on-error: true
        run: bandit -c bandit.yaml -r app -f sarif -o bandit.sarif || true

      - name: Upload SARIF to GitHub code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit.sarif
          category: bandit

      - name: Upload bandit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-reports
          path: |
            bandit-report.txt
            bandit-report.json
            bandit.sarif
          retention-days: 30

      # This is the gate: any MEDIUM or HIGH severity finding fails the build.
      - name: Fail on medium/high severity findings
        run: bandit -c bandit.yaml -r app -ll

  # -------------------------------------------------------------------------
  sca:
    name: SCA (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install "pip-audit==2.9.0"

      - name: Audit runtime and development dependencies
        id: audit
        continue-on-error: true
        run: |
          set +e
          pip-audit -r requirements.txt -r requirements-dev.txt \
            --format columns 2>&1 | tee pip-audit.txt
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          pip-audit -r requirements.txt -r requirements-dev.txt \
            --format json --output pip-audit.json
          exit 0

      - name: Summary
        if: always()
        run: |
          {
            echo "### SCA - pip-audit"
            echo ""
            echo '```text'
            cat pip-audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload pip-audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-reports
          path: |
            pip-audit.txt
            pip-audit.json
          retention-days: 30

      # The gate: a non-zero exit code means at least one known CVE was found.
      - name: Fail on known vulnerabilities
        if: steps.audit.outputs.status != '0'
        run: |
          echo "pip-audit reported known vulnerabilities (see the summary above)."
          exit 1

  # -------------------------------------------------------------------------
  sca-owasp:
    name: SCA (OWASP Dependency-Check, best effort)
    runs-on: ubuntu-latest
    # The NVD data feed is rate-limited without an API key, so this job is
    # informational and never blocks the pipeline.
    continue-on-error: true
    env:
      # Surfaced as an env var so the steps below can branch on its presence:
      # passing an empty `--nvdApiKey` would produce a malformed argument list.
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Run OWASP Dependency-Check (with NVD API key)
        if: env.NVD_API_KEY != ''
        uses: dependency-check/Dependency-Check_Action@main
        continue-on-error: true
        with:
          project: lab1-secure-rest-api
          path: "."
          format: "HTML"
          out: "dependency-check-report"
          args: >
            --enableExperimental
            --failOnCVSS 7
            --nvdApiKey ${{ secrets.NVD_API_KEY }}

      - name: Run OWASP Dependency-Check (no API key - rate-limited NVD feed)
        if: env.NVD_API_KEY == ''
        uses: dependency-check/Dependency-Check_Action@main
        continue-on-error: true
        with:
          project: lab1-secure-rest-api
          path: "."
          format: "HTML"
          out: "dependency-check-report"
          args: >
            --enableExperimental
            --failOnCVSS 7

      - name: Upload Dependency-Check report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: dependency-check-report
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          {
            echo "### SCA - OWASP Dependency-Check"
            echo ""
            echo "Informational job. Add an \`NVD_API_KEY\` repository secret"
            echo "(https://nvd.nist.gov/developers/request-an-api-key) to make"
            echo "the NVD download reliable."
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------------
  secrets-scan:
    name: Secret scanning (gitleaks, best effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------------------
  security-gate:
    name: Security gate
    runs-on: ubuntu-latest
    needs: [lint, test, sast, sca]
    if: always()
    steps:
      - name: Evaluate required jobs
        run: |
          {
            echo "## Security gate"
            echo ""
            echo "| Job | Result |"
            echo "| --- | ------ |"
            echo "| Lint (ruff) | ${{ needs.lint.result }} |"
            echo "| Tests (pytest, coverage >= 85%) | ${{ needs.test.result }} |"
            echo "| SAST (bandit) | ${{ needs.sast.result }} |"
            echo "| SCA (pip-audit) | ${{ needs.sca.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.lint.result }}" != "success" ] \
            || [ "${{ needs.test.result }}" != "success" ] \
            || [ "${{ needs.sast.result }}" != "success" ] \
            || [ "${{ needs.sca.result }}" != "success" ]; then
            echo "One or more required security checks failed."
            exit 1
          fi
          echo "All required security checks passed."
