# ---------------------------------------------------------------------------
# bandit configuration - SAST for the lab1 secure REST API.
#
# Run locally:  bandit -c bandit.yaml -r app -ll
# The CI job (`sast`) fails the build on any MEDIUM or HIGH severity finding.
# ---------------------------------------------------------------------------

# Directories that never contain production code.
exclude_dirs:
  - "./.venv"
  - "./.git"
  - "./tests"
  - "./build"
  - "./dist"

# No test is skipped globally: suppressions, if ever needed, must be inline
# `# nosec <ID>` comments with a written justification, so that every exception
# is visible in code review.
skips: []

# Explicitly assert the checks we care most about for this assignment.
tests:
  - B101  # assert_used
  - B102  # exec_used
  - B103  # set_bad_file_permissions
  - B104  # hardcoded_bind_all_interfaces
  - B105  # hardcoded_password_string
  - B106  # hardcoded_password_funcarg
  - B107  # hardcoded_password_default
  - B108  # hardcoded_tmp_directory
  - B110  # try_except_pass
  - B112  # try_except_continue
  - B201  # flask_debug_true
  - B301  # pickle
  - B303  # insecure hash functions (MD5/SHA1)
  - B304  # insecure ciphers
  - B305  # insecure cipher modes
  - B306  # mktemp_q
  - B307  # eval
  - B308  # mark_safe
  - B310  # urllib_urlopen
  - B311  # random (non-cryptographic PRNG)
  - B312  # telnetlib
  - B313  # xml bad cElementTree
  - B314  # xml bad ElementTree
  - B315  # xml bad expatreader
  - B316  # xml bad expatbuilder
  - B317  # xml bad sax
  - B318  # xml bad minidom
  - B319  # xml bad pulldom
  - B321  # ftplib
  - B323  # unverified context
  - B324  # hashlib insecure functions
  - B402  # import_telnetlib
  - B403  # import_pickle
  - B404  # import_subprocess
  - B405  # import_xml_etree
  - B411  # import_xmlrpclib
  - B501  # request_with_no_cert_validation
  - B502  # ssl_with_bad_version
  - B503  # ssl_with_bad_defaults
  - B504  # ssl_with_no_version
  - B505  # weak_cryptographic_key
  - B506  # yaml_load
  - B507  # ssh_no_host_key_verification
  - B601  # paramiko_calls
  - B602  # subprocess_popen_with_shell_equals_true
  - B603  # subprocess_without_shell_equals_true
  - B604  # any_other_function_with_shell_equals_true
  - B605  # start_process_with_a_shell
  - B606  # start_process_with_no_shell
  - B607  # start_process_with_partial_path
  - B608  # hardcoded_sql_expressions  <- the SQL-injection check
  - B609  # linux_commands_wildcard_injection
  - B610  # django_extra_used
  - B611  # django_rawsql_used
  - B701  # jinja2_autoescape_false
  - B702  # use_of_mako_templates
  - B703  # django_mark_safe

# B608 (SQL built from string concatenation/formatting) is the control that
# backs the "no string-built SQL" requirement of the assignment.
